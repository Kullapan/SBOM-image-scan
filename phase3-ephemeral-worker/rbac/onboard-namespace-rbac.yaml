# ==============================================================================
# Manifest: onboard-namespace-rbac.yaml
# Description: Grants sbom-scanner-sa LEAST-PRIVILEGE access in an application
#              namespace (Option 1 - no ClusterRole creation required).
#                1. system:image-puller  -> pull image layers from the internal registry
#                2. sbom-imagestream-reader (namespaced Role)
#                   -> read ImageStream metadata (creation timestamps, discovery)
#                   -> `get namespace` so the namespace appears in `oc get projects`
#              Replaces the former broad `view` ClusterRole binding (which also
#              exposed pods, configmaps, events, etc.).
# Usage (Project Admin of the target namespace is sufficient):
#   oc apply -f onboard-namespace-rbac.yaml -n <APPLICATION_NAMESPACE>
# Offboard:
#   oc delete -f onboard-namespace-rbac.yaml -n <APPLICATION_NAMESPACE>
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sbom-imagestream-reader
  labels:
    app.kubernetes.io/name: sbom-scanner
    app.kubernetes.io/part-of: dependency-track
rules:
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbom-scanner-imagestream-reader
  labels:
    app.kubernetes.io/name: sbom-scanner
    app.kubernetes.io/part-of: dependency-track
subjects:
  - kind: ServiceAccount
    name: sbom-scanner-sa
    namespace: secops-sbom
roleRef:
  kind: Role
  name: sbom-imagestream-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbom-scanner-image-puller
  labels:
    app.kubernetes.io/name: sbom-scanner
    app.kubernetes.io/part-of: dependency-track
subjects:
  - kind: ServiceAccount
    name: sbom-scanner-sa
    namespace: secops-sbom
roleRef:
  kind: ClusterRole
  name: system:image-puller
  apiGroup: rbac.authorization.k8s.io
