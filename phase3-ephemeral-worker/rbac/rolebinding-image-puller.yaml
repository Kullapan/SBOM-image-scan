# RoleBinding to allow sbom-scanner-sa to pull images from application namespaces
# Apply this into each target namespace where images reside:
#   oc apply -f rolebinding-image-puller.yaml -n <APPLICATION_NAMESPACE>
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbom-scanner-image-puller
  labels:
    app.kubernetes.io/name: sbom-scanner
subjects:
  - kind: ServiceAccount
    name: sbom-scanner-sa
    namespace: secops-sbom
roleRef:
  kind: ClusterRole
  name: system:image-puller
  apiGroup: rbac.authorization.k8s.io
