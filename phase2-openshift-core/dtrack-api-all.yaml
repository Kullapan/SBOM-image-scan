apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dtrack-data-pvc
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: dtrack-apiserver
    app.kubernetes.io/part-of: dependency-track
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtrack-apiserver
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: dtrack-apiserver
    app.kubernetes.io/part-of: dependency-track
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"dtrack-apiserver:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"dtrack-apiserver\")].image"}]
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dtrack-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dtrack-apiserver
        app.kubernetes.io/part-of: dependency-track
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dtrack-apiserver
          image: image-registry.openshift-image-registry.svc:5000/secops-sbom/dtrack-apiserver:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ALPINE_DATABASE_MODE
              value: "external"
            - name: ALPINE_DATABASE_DRIVER
              value: "org.postgresql.Driver"
            - name: ALPINE_DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/dtrack"
            - name: ALPINE_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: ALPINE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            # Explicitly anchor data directory so arbitrary UIDs write indexes to /data
            - name: ALPINE_DATA_DIRECTORY
              value: "/data"
            # Proxy Configuration (ConfigMap corporate-proxy-config)
            - name: EXTRA_JAVA_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: EXTRA_JAVA_OPTIONS
            - name: HTTP_PROXY
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: HTTP_PROXY
            - name: HTTPS_PROXY
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: HTTPS_PROXY
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: NO_PROXY
            - name: ALPINE_HTTP_PROXY_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: ALPINE_HTTP_PROXY_ADDRESS
                  optional: true
            - name: ALPINE_HTTP_PROXY_PORT
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: ALPINE_HTTP_PROXY_PORT
                  optional: true
            - name: ALPINE_NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: ALPINE_NO_PROXY
                  optional: true
          ports:
            - name: api
              containerPort: 8080
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: dtrack-storage
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
          # Startup probe allows up to 10 minutes on first boot for DB migration
          # and initial NVD data seed without tripping the liveness probe.
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: dtrack-storage
          persistentVolumeClaim:
            claimName: dtrack-data-pvc
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dtrack-apiserver
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: dtrack-apiserver
    app.kubernetes.io/part-of: dependency-track
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: dtrack-apiserver
