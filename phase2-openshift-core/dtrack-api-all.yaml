apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dtrack-data-pvc
  namespace: secops-sbom
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtrack-apiserver
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: dtrack-apiserver
    app.kubernetes.io/part-of: dependency-track
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dtrack-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dtrack-apiserver
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dtrack-apiserver
          image: image-registry.openshift-image-registry.svc:5000/secops-sbom/dtrack-apiserver:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ALPINE_DATABASE_MODE
              value: "external"
            - name: ALPINE_DATABASE_DRIVER
              value: "org.postgresql.Driver"
            - name: ALPINE_DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/dtrack"
            - name: ALPINE_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: ALPINE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: EXTRA_JAVA_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: EXTRA_JAVA_OPTIONS
            - name: HTTP_PROXY
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: HTTP_PROXY
            - name: HTTPS_PROXY
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: HTTPS_PROXY
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: corporate-proxy-config
                  key: NO_PROXY
          ports:
            - name: api
              containerPort: 8080
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: dtrack-storage
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/version
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: dtrack-storage
          persistentVolumeClaim:
            claimName: dtrack-data-pvc
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dtrack-apiserver
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: dtrack-apiserver
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: dtrack-apiserver
