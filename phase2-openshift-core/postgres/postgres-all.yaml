apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dependency-track
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
# ==============================================================================
# PostgreSQL Credentials Secret
# NOTE: In production, generate this secret out-of-band:
#   oc create secret generic postgres-auth \
#     --from-literal=POSTGRESQL_DATABASE=dtrack \
#     --from-literal=POSTGRESQL_USER=dtrack \
#     --from-literal=POSTGRESQL_PASSWORD="$(openssl rand -base64 24)" \
#     -n secops-sbom
# Both POSTGRES_* and POSTGRESQL_* keys are provided for backwards compatibility.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dependency-track
type: Opaque
stringData:
  POSTGRESQL_DATABASE: "dtrack"
  POSTGRESQL_USER: "dtrack"
  POSTGRESQL_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"
  # Backwards-compatibility aliases for Dependency-Track API Server
  POSTGRES_DB: "dtrack"
  POSTGRES_USER: "dtrack"
  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dependency-track
  annotations:
    # Redeploy automatically when the ImageStreamTag is updated
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"postgres-dtrack:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"postgres\")].image"}]
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: dependency-track
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: image-registry.openshift-image-registry.svc:5000/secops-sbom/postgres-dtrack:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRESQL_DATABASE
          ports:
            - name: postgresql
              containerPort: 5432
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/pgsql/data
              subPath: userdata
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dependency-track
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres
