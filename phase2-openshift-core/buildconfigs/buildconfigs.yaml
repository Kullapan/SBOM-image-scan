apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bc-postgres-dtrack
  namespace: secops-sbom
spec:
  source:
    type: Git
    git:
      uri: https://gitlab.corp.local/secops/SBOM-image-scan.git
      ref: main
    contextDir: images/openshift/postgres
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: postgres-dtrack:latest
---
