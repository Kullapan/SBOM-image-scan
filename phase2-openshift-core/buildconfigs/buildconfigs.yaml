# ==============================================================================
# OpenShift BuildConfigs for SBOM Infrastructure Images
#
# Production Note:
# 1. If GitLab is private, link a source secret via:
#      source:
#        sourceSecret:
#          name: gitlab-repo-secret
# 2. To pull base images from an internal registry (e.g. Nexus / Quay mirror),
#    supply buildArgs in dockerStrategy:
#      buildArgs:
#        - name: BASE_IMAGE
#          value: nexus.corp.local:8443/ubi9/ubi-minimal:latest
# 3. Alternatively, build images via GitLab CI / Jenkins and push directly
#    to OpenShift ImageStreams via `skopeo` or `podman push`.
# ==============================================================================
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bc-postgres-dtrack
  namespace: secops-sbom
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dependency-track
spec:
  source:
    type: Git
    git:
      uri: https://gitlab.corp.local/secops/SBOM-image-scan.git
      ref: main
    contextDir: images/openshift/postgres
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: postgres-dtrack:latest
---
