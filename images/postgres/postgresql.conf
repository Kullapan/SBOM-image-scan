# ==============================================================================
# PostgreSQL Configuration for OWASP Dependency-Track
# Optimized for high-throughput component indexing & vulnerability matching
# ==============================================================================

# Network & Connections
listen_addresses = '*'
max_connections = 100

# Memory Allocation
# Sized for standard container allocation (approx. 1GB - 2GB RAM container)
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Write-Ahead Log (WAL) & Checkpoints
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_timezone = 'UTC'
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
